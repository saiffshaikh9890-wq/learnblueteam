<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ANALYST — Defend the Network</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#020408;--bg2:#07090f;--bg3:#0d1118;
  --g:#00ff88;--gd:rgba(0,255,136,0.1);--gb:rgba(0,255,136,0.25);
  --r:#ff3355;--rd:rgba(255,51,85,0.1);--rb:rgba(255,51,85,0.25);
  --a:#ffaa00;--ad:rgba(255,170,0,0.09);--ab:rgba(255,170,0,0.22);
  --b:#00aaff;--bd:rgba(0,170,255,0.1);--bb:rgba(0,170,255,0.22);
  --tx:#fff;--tx2:rgba(255,255,255,0.6);--tx3:rgba(255,255,255,0.28);
  --tx4:rgba(255,255,255,0.08);--bdr:rgba(255,255,255,0.09);
  --mono:'Share Tech Mono',monospace;
  --sans:'Inter',sans-serif;
  --head:'Orbitron',sans-serif;
}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden;height:100dvh;width:100vw;touch-action:manipulation;font-size:15px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px)}

/* ── XP BURST ── */
.xp-burst{position:fixed;pointer-events:none;z-index:9999;font-family:var(--head);font-size:18px;font-weight:900;color:var(--g);text-shadow:0 0 20px rgba(0,255,136,0.6);animation:xpfly 1.2s ease forwards}
@keyframes xpfly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}

/* ── BOOT ── */
#boot{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;z-index:100;transition:opacity .5s}
.b-logo{font-family:var(--head);font-size:clamp(44px,11vw,80px);font-weight:900;letter-spacing:.2em;color:var(--g);text-shadow:0 0 40px rgba(0,255,136,0.4),0 0 100px rgba(0,255,136,0.12);margin-bottom:8px;animation:glitch 5s ease-in-out infinite}
@keyframes glitch{0%,88%,100%{text-shadow:0 0 40px rgba(0,255,136,0.4)}89%{text-shadow:-3px 0 rgba(255,51,85,0.9),3px 0 rgba(0,170,255,0.8)}91%{text-shadow:2px 0 rgba(255,51,85,0.8),-2px 0 rgba(0,170,255,0.8)}93%{text-shadow:0 0 40px rgba(0,255,136,0.4)}}
.b-sub{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,0.2);text-transform:uppercase;margin-bottom:40px}
.b-log{width:100%;max-width:500px;font-family:var(--mono);font-size:13px;line-height:2;color:rgba(255,255,255,0.5);margin-bottom:28px;min-height:180px}
.bl{opacity:0;transition:opacity .1s}.bl.in{opacity:1}.bl.dim{color:rgba(255,255,255,0.18)}
.b-cur{color:var(--g);animation:cur 1s steps(1) infinite;font-size:15px;font-family:var(--mono);display:none}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
.b-btn{display:none;padding:14px 44px;background:transparent;border:2px solid var(--g);color:var(--g);font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:20px;touch-action:manipulation;border-radius:4px}
.b-btn:hover,.b-btn:active{background:var(--g);color:#000}

/* ── GAME ROOT ── */
#game{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
#game.on{display:flex}

/* ── HUD ── */
.hud{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0}
.hud-l{display:flex;align-items:center;gap:14px}
.hud-brand{font-family:var(--head);font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--g);text-shadow:0 0 16px rgba(0,255,136,0.3)}
.hud-inc{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--tx3)}
.hud-r{display:flex;gap:16px;align-items:center}
.hstat{text-align:center}
.hstat-n{font-family:var(--head);font-size:16px;font-weight:800;color:var(--g);line-height:1;text-shadow:0 0 10px rgba(0,255,136,0.25)}
.hstat-l{font-family:var(--mono);font-size:8px;color:var(--tx3);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}

/* ── ATK BAR ── */
.atkbar{flex-shrink:0;padding:6px 18px 8px;background:var(--bg2);border-bottom:1px solid rgba(255,51,85,0.12)}
.atk-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;margin-bottom:4px;letter-spacing:.08em}
.atk-label{color:var(--r);display:flex;align-items:center;gap:6px}
.atk-dot{width:5px;height:5px;border-radius:50%;background:var(--r);animation:adot .6s steps(1) infinite}
@keyframes adot{0%,100%{opacity:1}50%{opacity:0}}
.atk-pct{color:var(--r)}
.atk-track{height:4px;background:rgba(255,51,85,0.08);border-radius:2px}
.atk-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#cc0022,var(--r),#ff6680);transition:width 1s linear;box-shadow:0 0 8px rgba(255,51,85,0.3)}
.atk-msg{font-family:var(--mono);font-size:10px;color:rgba(255,51,85,0.5);margin-top:4px;min-height:14px;letter-spacing:.04em;animation:msgin .3s ease}
@keyframes msgin{from{opacity:0}to{opacity:1}}

/* ── SCENE ── */
.scene{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sc-head{padding:10px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg2)}
.sc-phase{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.18em;padding:3px 9px;border-radius:3px;flex-shrink:0;text-transform:uppercase}
.ph-t{background:var(--rd);color:var(--r);border:1px solid var(--rb)}
.ph-i{background:var(--bd);color:var(--b);border:1px solid var(--bb)}
.ph-c{background:var(--ad);color:var(--a);border:1px solid var(--ab)}
.ph-cl{background:var(--gd);color:var(--g);border:1px solid var(--gb)}
.sc-title{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--tx);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 10px}
.sc-num{font-family:var(--mono);font-size:10px;color:var(--tx3);flex-shrink:0}
.sc-brief{padding:10px 18px;background:rgba(0,255,136,0.03);border-bottom:1px solid rgba(0,255,136,0.07);font-size:13px;line-height:1.6;color:var(--tx2);flex-shrink:0}
.sc-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sc-body::-webkit-scrollbar{width:3px}
.sc-body::-webkit-scrollbar-thumb{background:rgba(0,255,136,0.15)}
.sc-foot{padding:10px 18px 18px;border-top:1px solid var(--bdr);flex-shrink:0;background:var(--bg2)}

/* ── FLASH ── */
.flash{position:fixed;inset:0;pointer-events:none;z-index:8000;opacity:0;transition:opacity .08s}
.flash.r{background:rgba(255,51,85,0.16)}.flash.g{background:rgba(0,255,136,0.1)}.flash.on{opacity:1}

/* ── EMAIL ── */
.email-wrap{padding:14px 18px}
.inbox-hdr{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,255,136,0.4);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--bdr);display:flex;gap:8px;align-items:center}
.unread-badge{background:var(--rd);color:var(--r);padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;border:1px solid var(--rb)}
.email-card{border:1px solid var(--bdr);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s;background:var(--bg3)}
.email-card.open{border-color:rgba(0,255,136,0.3)}
.email-prev{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.email-av{width:36px;height:36px;border-radius:50%;background:var(--rd);border:2px solid var(--rb);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.email-meta{flex:1;min-width:0}
.email-from{font-size:14px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.sus{color:var(--r)}
.email-subj{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.email-time{font-family:var(--mono);font-size:10px;color:var(--tx3)}
.email-bdy{padding:14px 16px;background:var(--bg2);border-top:1px solid var(--bdr);display:none}
.email-card.open .email-bdy{display:block}
.ef{display:flex;gap:8px;margin-bottom:7px;font-size:13px;align-items:flex-start}
.ef-k{font-family:var(--mono);color:var(--tx3);flex-shrink:0;width:62px;font-size:11px;margin-top:1px}
.ef-v{color:var(--tx2);flex:1}
.ef-v.s{color:var(--r)}
.email-text{margin:12px 0;padding:14px;background:rgba(255,255,255,0.02);border-left:3px solid rgba(255,255,255,0.08);border-radius:0 6px 6px 0;font-family:Georgia,serif;font-size:14px;color:rgba(255,255,255,0.55);line-height:1.75;white-space:pre-wrap}
.attach-row{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid rgba(255,170,0,0.25);border-radius:6px;font-size:13px;color:var(--a);margin:6px 0;background:rgba(255,170,0,0.04);cursor:pointer}
.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.07em;margin-left:5px;text-transform:uppercase}
.badge-warn{background:var(--ad);color:var(--a);border:1px solid var(--ab)}
.badge-danger{background:var(--rd);color:var(--r);border:1px solid var(--rb)}
.hdr-toggle{font-family:var(--mono);font-size:11px;color:var(--tx3);cursor:pointer;margin-top:10px;display:block;letter-spacing:.04em}
.hdr-toggle:hover{color:var(--tx2)}
.hdr-list{display:none;margin-top:8px;padding:10px 12px;background:rgba(0,0,0,0.5);border-radius:6px;font-family:var(--mono);font-size:11px;line-height:2;border:1px solid rgba(255,51,85,0.15)}
.hdr-list.open{display:block;animation:gin .2s ease}
.hdr-bad{color:var(--r)}
.tap-hint{font-size:13px;color:var(--tx3);text-align:center;margin-top:10px;font-style:italic}
/* IOC warning panel */
.ioc-panel{margin-top:12px;padding:12px 14px;background:var(--rd);border:1px solid var(--rb);border-radius:8px;animation:gin .3s ease}
.ioc-title{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--r);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ioc-item{font-size:12px;color:rgba(255,120,120,0.85);margin-bottom:4px;display:flex;gap:6px}
.ioc-item::before{content:'⚠';flex-shrink:0}

/* ── SIEM ── */
.siem-wrap{padding:14px 18px;background:#000;min-height:100%}
.siem-hdr{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,255,136,0.4);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,0.06)}
.al{border-left:3px solid transparent;border:1px solid var(--bdr);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s;overflow:hidden}
.al:hover{border-color:rgba(0,255,136,0.25)}
.al.sel{border-color:rgba(0,255,136,0.4);background:rgba(0,255,136,0.04)}
.al.crit{border-left:3px solid var(--r)}
.al.high{border-left:3px solid var(--a)}
.al-top{display:flex;gap:8px;align-items:center;padding:10px 14px}
.al-sev{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.07em;flex-shrink:0}
.sev-CRITICAL{background:var(--rd);color:var(--r);border:1px solid var(--rb)}
.sev-HIGH{background:var(--ad);color:var(--a);border:1px solid var(--ab)}
.al-rule{font-size:13px;color:var(--tx);font-weight:700;flex:1}
.al-time{font-family:var(--mono);font-size:10px;color:var(--tx3);flex-shrink:0}
.al-pulse{width:6px;height:6px;border-radius:50%;background:var(--r);animation:ap .6s steps(1) infinite;flex-shrink:0;box-shadow:0 0 6px var(--r)}
@keyframes ap{0%,100%{opacity:1}50%{opacity:0}}
.al-msg{font-size:12px;color:var(--tx2);padding:0 14px 10px}
.al-det{padding:10px 14px;border-top:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.4);display:none}
.al-det.open{display:block;animation:gin .2s ease}
@keyframes gin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.al-row{display:flex;gap:8px;font-size:12px;margin-bottom:4px}
.ar-k{font-family:var(--mono);color:var(--tx3);flex-shrink:0;width:72px;font-size:11px}
.ar-v{color:var(--tx)}
.ar-v.bad{color:var(--r)}

/* ── EDR ── */
.edr-wrap{padding:14px 18px;background:#000;min-height:100%}
.edr-hdr{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--b);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid rgba(0,170,255,0.15);display:flex;gap:8px;align-items:center}
.edr-host{background:var(--bd);color:var(--b);padding:2px 8px;border-radius:3px;font-size:10px;border:1px solid var(--bb)}
.proc{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;border:1px solid transparent;margin-bottom:4px;cursor:pointer;transition:all .15s}
.proc:hover{border-color:var(--bdr);background:var(--tx4)}
.proc.sel{border-color:rgba(0,170,255,0.35);background:var(--bd)}
.proc.suspicious{border-color:rgba(255,170,0,0.18);background:rgba(255,170,0,0.04)}
.proc.suspicious .pname{color:var(--a)}
.proc.malicious{border-color:rgba(255,51,85,0.22);background:var(--rd)}
.proc.malicious .pname{color:var(--r)}
.pindent{flex-shrink:0;color:var(--tx3)}
.pname{flex:1;font-size:13px;font-weight:600}
.ppid{font-family:var(--mono);font-size:10px;color:var(--tx3)}
.ptag{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700;letter-spacing:.06em;flex-shrink:0}
.pt-sus{background:var(--ad);color:var(--a);border:1px solid var(--ab)}
.pt-mal{background:var(--rd);color:var(--r);border:1px solid var(--rb)}
.pdet{margin-bottom:6px;padding:10px 12px;background:rgba(0,0,0,0.5);border:1px solid var(--bdr);border-radius:6px;font-size:12px;display:none;animation:gin .2s ease}
.pdet.open{display:block}
.pd-row{display:flex;gap:8px;margin-bottom:3px}
.pd-k{font-family:var(--mono);color:var(--tx3);flex-shrink:0;width:76px;font-size:11px}
.pd-v{color:var(--tx)}
.pd-v.bad{color:var(--r)}
.hash-wrap{margin-top:14px;padding:14px;border:1px solid var(--bdr);border-radius:8px;background:rgba(0,0,0,0.5)}
.hw-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:9px}
.hw-row{display:flex;gap:8px;margin-bottom:9px}
.hw-inp{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--bdr);border-radius:5px;padding:9px 12px;color:var(--g);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s}
.hw-inp:focus{border-color:var(--g);background:rgba(0,255,136,0.04)}
.hw-btn{padding:9px 16px;background:var(--gd);border:1px solid var(--gb);color:var(--g);font-family:var(--mono);font-size:12px;cursor:pointer;border-radius:5px;transition:all .2s;touch-action:manipulation;font-weight:700;letter-spacing:.06em}
.hw-btn:hover,.hw-btn:active{background:rgba(0,255,136,0.18)}
.hash-res{padding:12px;border-radius:6px;font-size:13px;line-height:1.75;animation:gin .3s ease}
.hash-res.mal{background:var(--rd);border:1px solid var(--rb)}
.hash-res.safe{background:var(--gd);border:1px solid var(--gb)}
.hr-score{font-family:var(--head);font-size:22px;font-weight:900;margin-bottom:4px}
.hr-score.bad{color:var(--r);text-shadow:0 0 16px rgba(255,51,85,0.35)}
.hr-score.ok{color:var(--g)}

/* ── NETWORK ── */
.net-wrap{padding:14px 18px;background:#000;min-height:100%}
.net-hdr{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid rgba(255,170,0,0.15)}
.conn-card{border:1px solid rgba(255,51,85,0.3);border-radius:10px;overflow:hidden;margin-bottom:14px}
.conn-top{padding:10px 16px;background:rgba(255,51,85,0.07);border-bottom:1px solid rgba(255,51,85,0.12);display:flex;align-items:center;gap:10px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--r);animation:ap .5s steps(1) infinite;box-shadow:0 0 8px var(--r)}
.conn-dot.off{background:var(--g);animation:none;box-shadow:0 0 8px var(--g)}
.conn-title{font-size:13px;color:var(--tx);font-weight:700;flex:1}
.conn-body{padding:12px 16px}
.conn-row{display:flex;gap:8px;margin-bottom:7px;font-size:13px}
.ck{font-family:var(--mono);color:var(--tx3);flex-shrink:0;width:80px;font-size:11px;margin-top:1px}
.cv{color:var(--tx);flex:1}
.cv.bad{color:var(--r)}
.cv.ok{color:var(--g)}
.conn-visual{display:flex;align-items:center;gap:10px;margin:12px 0;padding:14px;background:rgba(0,0,0,0.5);border-radius:8px;font-size:13px}
.cv-node{flex:1;padding:10px;border-radius:6px;border:1px solid;text-align:center;font-size:12px;font-weight:600}
.cv-node.inf{border-color:rgba(255,51,85,0.35);background:rgba(255,51,85,0.07)}
.cv-node.ext{border-color:rgba(255,170,0,0.28);background:rgba(255,170,0,0.06)}
.cv-lbl{font-family:var(--mono);font-size:9px;color:var(--tx3);margin-top:4px;letter-spacing:.06em}
.cv-arr{color:var(--r);font-size:16px;animation:arr 1s ease-in-out infinite;flex-shrink:0;font-weight:700}
.cv-arr.off{color:var(--g);animation:none}
@keyframes arr{0%,100%{opacity:.3;transform:translateX(-3px)}50%{opacity:1;transform:translateX(3px)}}

/* ── QUARANTINE ── */
.quar-wrap{padding:14px 18px;background:#000;min-height:100%}
.q-path{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-bottom:12px;padding:8px 12px;background:rgba(255,255,255,0.02);border-radius:5px;border:1px solid var(--bdr)}
.q-path span{color:var(--g)}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;border:1px solid transparent;margin-bottom:4px;cursor:pointer;transition:all .15s}
.frow:hover{border-color:var(--bdr);background:var(--tx4)}
.frow.sel{border-color:rgba(255,51,85,0.35);background:var(--rd)}
.frow.done{border-color:rgba(0,255,136,0.25);background:var(--gd);opacity:.65;cursor:default}
.frow.done .fname{text-decoration:line-through;color:rgba(0,255,136,0.65)}
.ficon{font-size:18px;flex-shrink:0}
.fname{font-size:14px;font-weight:600;flex:1}
.fsize{font-family:var(--mono);font-size:10px;color:var(--tx3)}
.ftag{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;font-weight:700;letter-spacing:.06em;flex-shrink:0}
.ftag-mal{background:var(--rd);color:var(--r);border:1px solid var(--rb)}
.ftag-ok{background:var(--gd);color:var(--g);border:1px solid var(--gb)}
.factions{padding:12px 14px;border:1px solid var(--bdr);border-radius:8px;background:rgba(0,0,0,0.5);margin-top:10px;display:none;animation:gin .2s ease}
.factions.open{display:block}
.fa-title{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:9px}
.fa-row{display:flex;gap:8px;font-size:12px;margin-bottom:4px}

    G.atkProg=Math.min(100,G.atkProg+1);
    document.getElementById('atk-fill').style.width=G.atkProg+'%';
    document.getElementById('atk-pct').textContent=G.atkProg+'%';
    // Damage messages
    const msg=ATK_MSGS.find(m=>m.pct===G.atkProg);
    if(msg){document.getElementById('atk-msg').textContent=msg.msg;}
    // Red tint when high
    if(G.atkProg>=60){
      document.getElementById('atk-fill').style.boxShadow='0 0 16px rgba(255,51,85,0.6)';
    }
    if(G.atkProg>=100) endGame(false);
  },10000);
  G.elTimer=setInterval(()=>{
    G.elapsed++;
    const m=String(Math.floor(G.elapsed/60)).padStart(2,'0');
    const s=String(G.elapsed%60).padStart(2,'0');
    document.getElementById('hud-time').textContent=m+':'+s;

  clearInterval(G.atkTimer);clearInterval(G.elTimer);
  const pct=G.decisions>0?Math.round((G.correct/G.decisions)*100):80;
  const grade=success?(pct>=90?'S':pct>=75?'A':pct>=60?'B':'C'):'F';

  // Save to Supabase
  const userName = (() => { try{ const r=JSON.parse(localStorage.getItem('lbt_user')||'{}'); return r.name||r.email?.split('@')[0]||'Anonymous'; }catch{return 'Anonymous';} })();
  try {
    await fetch(`${SUPA_URL}/rest/v1/game_runs`,{
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({incident_id:INC_ID,grade,xp:G.xp,accuracy:pct,time_secs:G.elapsed,user_name:userName})
    });
  } catch(e){}

  // Save to localStorage for dashboard
  try{localStorage.setItem('lbt_game_result',JSON.stringify({incId:INC_ID,xp:G.xp,grade,time:G.elapsed,pct,at:Date.now()}));}catch(e){}

  // Show score
  const gradeClass={S:'gr-s',A:'gr-a',B:'gr-b',C:'gr-b',F:'gr-f'}[grade];
  document.getElementById('sc-grade').textContent=grade;
  document.getElementById('sc-grade').className='sc-grade '+gradeClass;
  document.getElementById('sc-sub').textContent=success?'INCIDENT CONTAINED — ATTACKER EXPELLED':'DRILL FAILED — ATTACKER SUCCEEDED';
  const m=String(Math.floor(G.elapsed/60)).padStart(2,'0');
  const s=String(G.elapsed%60).padStart(2,'0');
  document.getElementById('sc-time').textContent=m+':'+s;
  document.getElementById('sc-xp').textContent=G.xp;
  document.getElementById('sc-acc').textContent=pct+'%';

  // Load leaderboard
  loadLeaderboard(grade,G.xp,userName);

  setTimeout(()=>document.getElementById('score').classList.add('on'),400);
}

async function loadLeaderboard(myGrade,myXp,myName){
  const lbEl=document.getElementById('lb-rows');
  lbEl.innerHTML='<div style="font-family:var(--mono);font-size:11px;color:var(--tx3);text-align:center;padding:8px">Loading rankings...</div>';
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/game_runs?incident_id=eq.${INC_ID}&order=xp.desc&limit=10`,{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    const rows=await res.json();
    lbEl.innerHTML='';
    if(!rows||rows.length===0){
      lbEl.innerHTML='<div style="font-family:var(--mono);font-size:11px;color:var(--tx3);text-align:center;padding:8px">Be the first on the board!</div>';
      return;
    }
    rows.forEach((row,idx)=>{
      const isYou=row.user_name===myName&&row.xp===myXp;
      const rank=idx+1;
      const rankClass=rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
      const rankSymbol=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
      const gradeColor={'S':'var(--g)','A':'var(--b)','B':'var(--a)','C':'var(--tx2)','F':'var(--r)'}[row.grade]||'var(--tx2)';
      const div=document.createElement('div');
      div.className='lb-row'+(isYou?' you':'');
      div.innerHTML=`<div class="lb-rank ${rankClass}">${rankSymbol}</div><div class="lb-name">${row.user_name||'Anonymous'}${isYou?' (you)':''}</div><div class="lb-grade" style="color:${gradeColor}">${row.grade}</div><div class="lb-xp">${row.xp} XP</div>`;
      lbEl.appendChild(div);
    });
  }catch(e){
    lbEl.innerHTML='<div style="font-family:var(--mono);font-size:11px;color:var(--tx3);text-align:center;padding:8px">Could not load rankings.</div>';
  }
}

function replayGame(){
  document.getElementById('score').classList.remove('on');
  G.xp=0;G.elapsed=0;G.atkProg=0;G.correct=0;G.decisions=0;
  document.getElementById('hud-xp').textContent='0';
  document.getElementById('hud-time').textContent='00:00';
  document.getElementById('atk-msg').textContent='';
  updateAtk();
  clearInterval(G.atkTimer);clearInterval(G.elTimer);
  G.atkTimer=setInterval(()=>{G.atkProg=Math.min(100,G.atkProg+1);document.getElementById('atk-fill').style.width=G.atkProg+'%';document.getElementById('atk-pct').textContent=G.atkProg+'%';const msg=ATK_MSGS.find(m=>m.pct===G.atkProg);if(msg)document.getElementById('atk-msg').textContent=msg.msg;if(G.atkProg>=100)endGame(false);},10000);
  G.elTimer=setInterval(()=>{G.elapsed++;const m=String(Math.floor(G.elapsed/60)).padStart(2,'0');const s=String(G.elapsed%60).padStart(2,'0');document.getElementById('hud-time').textContent=m+':'+s;},1000);
  loadScene(0);
}
function goBack(){
  try{const r=JSON.parse(localStorage.getItem('lbt_game_result')||'{}');if(r.xp)localStorage.setItem('lbt_xp_pending',r.xp);}catch(e){}
  location.href='/';
}
</script>
